[package]
name = "endora-sound-hub"
description = "endora-sound (ADR 0103): the sound hub. Its own container and state; it works without Endora, and the Endora node is its remote."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "endora-sound-hub"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
endora-sound = { path = "../../domains/sound" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
