[package]
name = "endora-persistence"
description = "Shared SQLite handle: one connection every context's repositories share"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
endora-kernel = { path = "../kernel" }
rusqlite = { version = "0.40", features = ["bundled"] }
# Secrets at rest (ADR 0125): the AEAD that seals credential columns, and the encoding of the
# sealed text. All three were already in the lock file at these versions (the handheld's
# vault uses the same cipher), so this adds no new crate to the build — only edges.
chacha20poly1305 = "0.10"
base64 = "0.22"
zeroize = "1"

[lints]
workspace = true
