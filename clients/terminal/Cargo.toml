[package]
name = "endora-terminal"
version = "0.13.2"
edition = "2024"
rust-version = "1.87"
description = "A thin Endora terminal client for Linux appliances"
license = "Apache-2.0"

[dependencies]
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
rpassword = "7"
rustix = { version = "0.38", features = ["process", "fs", "event"] }
unicode-width = "0.2"
# Passphrase-derived authenticated session encryption and explicit secret clearing.
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = {version = "1", features = ["derive"]}
# Spotify sign-in (PKCE): SHA-256 of the verifier, URL-safe base64.
sha2 = "0.10"
base64 = "0.22"
# Draws the sign-in link as a QR code in the terminal (text output only, no images).
qrcode = { version = "0.14", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
