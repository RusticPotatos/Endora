name: Core image

# Publishes Core's image (ghcr.io/rusticpotatos/endora-node), which deploy/compose pins
# (ADR 0147): `sha-<commit>` for every push to develop or main, `latest` for main, and `X.Y.Z`
# for a `vX.Y.Z` tag. Nothing is published from any other branch or from a pull request.
on:
  push:
    branches: [main, develop]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build and publish · amd64 + arm64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Nothing local in the build context
        run: sh scripts/check-image-privacy.sh context .
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rusticpotatos/endora-node
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      # Built and checked before anything is pushed: an image carrying local files is never published.
      - name: Build for the check
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: endora-node:candidate
          build-args: ENDORA_BUILD=${{ github.sha }}
          cache-from: type=gha,scope=core-image-release
          cache-to: type=gha,scope=core-image-release,mode=max
      - name: Nothing local in the image
        run: sh scripts/check-image-privacy.sh image endora-node:candidate
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ENDORA_BUILD=${{ github.sha }}
          cache-from: type=gha,scope=core-image-release
          cache-to: type=gha,scope=core-image-release,mode=max
