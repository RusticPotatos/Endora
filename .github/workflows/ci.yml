name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Private observer and job agent contracts
        run: |
          python3 scripts/test-homelab-proxy.py

      - name: Handheld terminal checks
        working-directory: clients/terminal
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/check-private.py
          cargo build --locked -p endora-terminal
          python3 scripts/check-pty.py ../../target/debug/endora-terminal
          python3 scripts/check-pty.py ../../target/debug/endora-terminal linux

      - name: Console screens render
        run: node scripts/check-console.mjs

      - name: Nothing personal in the tree
        run: node scripts/check-nothing-personal.mjs

      - name: Whitespace / conflict-marker check
        run: git diff --check

  # Endora's Ansible roles (endora.homelab): their tests, syntax and rendering.
  ansible-collection:
    name: ansible collection · endora.homelab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ansible and the Docker collection
        run: |
          python3 -m pip install ansible-core==2.16.3
          ansible-galaxy collection install 'community.docker:>=3.7.0'

      - name: Every role's checks
        run: sh deploy/ansible/collection/check.sh

  # The handheld's release bundle: built for the device (ARM64, static musl), never on it.
  terminal-arm64:
    name: handheld terminal · ARM64 bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/terminal
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain with the device target
        run: |
          rustup toolchain install 1.87.0 --profile minimal --target aarch64-unknown-linux-musl
          rustup default 1.87.0

      - name: Cross-compiler
        run: |
          python3 -m pip install ziglang==0.13.0
          cargo install cargo-zigbuild --version 0.20.1 --locked

      - name: Build and package
        run: |
          sh scripts/build-arm64.sh
          sh scripts/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: endora-terminal-arm64
          path: clients/terminal/dist/
