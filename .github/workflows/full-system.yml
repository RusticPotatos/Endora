name: Full system

# The full-system bundle (deploy/compose, ADR 0147) on a plain ubuntu runner: Core built from
# this commit, Console and Audio at their pinned releases, a stub model. Brings it all up, checks
# every product and a sign-in through `endora-core setup`, then takes it down.
on:
  push:
    paths:
      - "deploy/compose/**"
      - "scripts/check-image-privacy.sh"
      - ".dockerignore"
      - "Dockerfile"
      - "app/node/**"
      - "app/hq/**"
      - "app/runner/**"
      - "crates/**"
      - "shared/**"
      - "docs/api/console-v1.json"
      - ".github/workflows/full-system.yml"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: full-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: full-system bundle · ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Docker and Compose versions
        run: docker version && docker compose version

      - name: The bundle test's own helpers
        run: sh deploy/compose/ci/test-checks.sh

      - name: The vendored compose files match their sources
        run: sh deploy/compose/check-sources.sh --remote && sh deploy/compose/check-sources.sh --self-test

      - name: Two installs cannot share Core's names; the example renders; the guide's commands are right
        run: sh deploy/compose/check-isolation.sh

      - name: Nothing local reaches Core's image (the check's own test, then the build context)
        run: sh scripts/check-image-privacy.sh --self-test && sh scripts/check-image-privacy.sh context .

      - uses: docker/setup-buildx-action@v3

      - name: Build Core's image from this commit
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/rusticpotatos/endora-node:ci
          build-args: ENDORA_BUILD=${{ github.sha }}
          cache-from: type=gha,scope=core-image
          cache-to: type=gha,scope=core-image,mode=max

      - name: Nothing local in the built image
        run: sh scripts/check-image-privacy.sh image ghcr.io/rusticpotatos/endora-node:ci

      - name: Bring the bundle up, check every product, take it down
        run: sh deploy/compose/test-bundle.sh
