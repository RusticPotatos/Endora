[package]
name = "endora-conversation"
description = "Conversation context: the chat model and the conversation repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The action trail is stored as JSON by design, so reading it back needs what wrote it.
# Already carried by sibling domain crates; no new name enters the tree.
serde_json = "1.0.150"
endora-kernel = { path = "../../shared/kernel" }
endora-persistence = { path = "../../shared/persistence" }
rusqlite = { version = "0.39", features = ["bundled"] }

[lints]
workspace = true
