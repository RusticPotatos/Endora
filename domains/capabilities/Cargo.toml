[package]
name = "endora-capabilities"
description = "Capabilities context: the butler's skills, the runner/policy gate, egress guard, and their configuration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
endora-kernel = { path = "../../shared/kernel" }
endora-persistence = { path = "../../shared/persistence" }
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3.4", features = ["json", "socks-proxy"] }
serde_json = "1.0.150"
# Spotify's sign-in without a client secret (PKCE): SHA-256 of the verifier, URL-safe base64.
# Already in the workspace for the handheld.
sha2 = "0.10"
base64 = "0.22"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }

[lints]
workspace = true

[dev-dependencies]
# The handheld's wire types, to prove the console's responses fit them (ADR 0099).
endora-protocol = { path = "../../shared/protocol" }
serde = { version = "1", features = ["derive"] }
# The owner's scenarios for the bridge (docs/testing.md): `features/*.feature`, run by
# `tests/scenarios.rs`. The same release as domains/team, for the same reasons.
cucumber = "0.21"
futures = "0.3"

# cucumber's own harness, not libtest's; `cargo test` runs it with the rest.
[[test]]
name = "scenarios"
harness = false
