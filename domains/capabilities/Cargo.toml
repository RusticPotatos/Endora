[package]
name = "endora-capabilities"
description = "Capabilities context: the butler's skills, the runner/policy gate, egress guard, and their configuration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
endora-kernel = { path = "../../shared/kernel" }
endora-persistence = { path = "../../shared/persistence" }
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3.3", features = ["json", "socks-proxy"] }
serde_json = "1.0.150"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }

[lints]
workspace = true
