[package]
name = "endora-mail"
description = "Mail context: what code can tell about a message, how it is sorted, and the digest Endora keeps (ADR 0097)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
endora-kernel = { path = "../../shared/kernel" }
endora-persistence = { path = "../../shared/persistence" }
# MIME is large, old and adversarial; a maintained parser is the safer choice (ADR 0097).
# Pinned below 0.11.3, the first release that needs a newer Rust than this workspace's 1.87.
mail-parser = { version = "=0.11.2", features = ["full_encoding"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1.0.150"

[lints]
workspace = true
