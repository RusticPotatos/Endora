[package]
name = "endora-team"
description = "Team context (Endora HQ): goals, tasks, members, wakes, runs, the tick, the budget ledger and the event feed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# How the home lab is built (ADR 0112): the one text the house log is seeded with and the
# worker's instructions carry. The shared kernel, which depends on nothing.
endora-kernel = { path = "../../shared/kernel" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
# Named for the bound of the one typed settings read; serde_json already builds it.
serde = "1.0.229"
# The rules of chess (ADR 0121): legal moves, check, mate, stalemate, repeated positions and
# the notation moves are written in. Pure Rust with no IO, MIT licensed (the workspace is
# Apache-2.0; `shakmaty`, the better-known crate, is GPL-3.0-or-later and cannot be linked
# into it), so the domain stays free of IO and of vendors. Writing legal move generation by
# hand is exactly the kind of work a library is for.
cozy-chess = "0.3"

[dev-dependencies]
# The owner's scenarios (docs/testing.md): `features/*.feature` in plain words, run by
# `tests/scenarios.rs` against the real engine. Tests only, never shipped. 0.21 is the last
# release that builds on the workspace's MSRV (0.22 and 0.23 want Rust 1.88), and n-1 besides.
cucumber = "0.21"
# The executor the scenario harness runs cucumber's futures on; cucumber already depends on it.
futures = "0.3"

# The scenario harness is cucumber's own, not libtest's: it reads the `.feature` files and
# prints each step. `cargo test` runs it with the rest.
[[test]]
name = "scenarios"
harness = false

[lints]
workspace = true
