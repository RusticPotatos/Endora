[package]
name = "endora-domain"
description = "Endora domain layer: pure concepts of the platform with no transport, storage, UI, OS, or AI-model dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The domain layer depends only on the shared kernel (typed ids, time, errors,
# AutonomyLevel) — itself dependency-free. Any other dependency here is an
# architectural decision that requires an ADR (see docs/adr/).
[dependencies]
endora-kernel = { path = "../../shared/kernel" }
# Temporary migration shim: AuditRecord now lives in the platform context and is
# re-exported here so existing `endora_domain::AuditRecord` paths keep working
# until callers are repointed. Removed when the old crates are deleted (ADR 0026).
endora-platform = { path = "../../domains/platform" }

[lints]
workspace = true
