[package]
name = "endora-domain"
description = "Endora domain layer: pure concepts of the platform with no transport, storage, UI, OS, or AI-model dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The domain layer depends only on the shared kernel (typed ids, time, errors,
# AutonomyLevel) — itself dependency-free. Any other dependency here is an
# architectural decision that requires an ADR (see docs/adr/).
[dependencies]
endora-kernel = { path = "../../shared/kernel" }

[lints]
workspace = true
