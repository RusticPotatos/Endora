[package]
name = "endora-infrastructure"
description = "Endora infrastructure layer: adapters implementing application ports, including SQLite-backed persistence (ADR 0004)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
endora-application = { path = "../endora-application" }
endora-capabilities = { path = "../../domains/capabilities" }
endora-understanding = { path = "../../domains/understanding" }
rusqlite = { version = "0.39", features = ["bundled"] }
endora-persistence = { path = "../../shared/persistence" }
uuid = { version = "1.24.0", features = ["v4"] }
ureq = { version = "3.3", features = ["json", "socks-proxy"] }
serde_json = "1.0.150"

[dev-dependencies]
# Repositories that moved to their bounded contexts (ADR 0026); the SqliteStore
# migration/export/config tests exercise them through the context stores over
# the same shared connection.
endora-capabilities = { path = "../../domains/capabilities" }
endora-understanding = { path = "../../domains/understanding" }
endora-platform = { path = "../../domains/platform" }

[lints]
workspace = true
