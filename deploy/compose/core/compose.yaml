# Endora Core on its own: the node, HQ (the team engine) and, when you turn it on, the runner that
# takes the team's turns in fenced worker containers. Docker Compose v2.20 or later.
#
#   cp core.env.example .env          # set ENDORA_CORE_VERSION and your values
#   docker compose up -d              # node + HQ
#   docker compose exec node endora-core setup     # make the owner (once)
#
# Then open https://<host>:8787 (or put Endora Console in front: docs/install.md). Nothing here
# needs make, local.mk, release.sh, a NAS or a Pi: every setting is a variable with a safe
# default, documented in core.env.example. Model and provider keys, tokens and connections are
# yours to add after setup; nothing is provisioned unattended (docs/install.md).
#
# Made to be included unchanged by the full-system bundle (../compose.yaml): volume and network
# names are fixed, so the same data is used alone or in the bundle, nothing is built, and
# nothing is bind-mounted from a relative path. ADR 0147.

name: endora-core

x-fenced: &fenced
  restart: unless-stopped
  pull_policy: missing
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  labels:
    # Released by its owner (pull a new ENDORA_CORE_VERSION), never by Watchtower: a container
    # recreated at night cuts the team's turns.
    com.centurylinklabs.watchtower.enable: "false"

services:
  # The node: Core's API (the Console contract, docs/api/console-v1.md), sign-in, the secret
  # store, the model relay and the team's listener. Everything stateful is in /data: the
  # database, its secrets key (secrets.key) and the TLS certificate.
  node:
    <<: *fenced
    image: ${ENDORA_CORE_IMAGE:-ghcr.io/rusticpotatos/endora-node}:${ENDORA_CORE_VERSION:?set ENDORA_CORE_VERSION to a released Core version (core.env.example)}
    entrypoint: [endora-node]
    ports:
      # The owner API and, until the Console cutover, Core's built-in screens. The bundle binds
      # it to the host's loopback and puts Console in front.
      - "${ENDORA_CORE_BIND:-0.0.0.0}:${ENDORA_CORE_PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ENDORA_ADDR: 0.0.0.0:8787
      ENDORA_DB: /data/endora.db
      # Self-signed HTTPS (the certificate is kept in /data; ENDORA_TLS_SAN names this host).
      # 0 behind something that terminates TLS, such as Console with its own certificate.
      ENDORA_TLS: ${ENDORA_TLS:-1}
      ENDORA_TLS_SAN: ${ENDORA_TLS_SAN:-}
      # Any OpenAI-compatible endpoint. The default is an Ollama on this host.
      ENDORA_MODEL_URL: ${ENDORA_MODEL_URL:-http://host.docker.internal:11434/v1}
      ENDORA_MODEL: ${ENDORA_MODEL:-qwen2.5:7b}
      # HQ, below, signing with the token HQ makes in the volume the two share.
      ENDORA_HQ_URL: http://hq:8790
      ENDORA_HQ_TOKEN_FILE: /hq-token/token
      # The team listener: model relays, contracts and HQ's gateway for the workers, on the
      # fenced team network only (not published; publish 8788 only for a runner on another host).
      ENDORA_TEAM_ADDR: 0.0.0.0:8788
      # Endora Audio, optional: its URL and its token (32+ characters). Empty: no sound tools,
      # and Core works the same.
      ENDORA_SOUND_URL: ${ENDORA_SOUND_URL:-}
      ENDORA_SOUND_TOKEN: ${ENDORA_SOUND_TOKEN:-}
      ENDORA_TIME_ZONE: ${ENDORA_TIME_ZONE:-}
      ENDORA_UTC_OFFSET_MINUTES: ${ENDORA_UTC_OFFSET_MINUTES:-0}
    volumes:
      - endora-core-data:/data
      # The token HQ makes for itself, which the node signs with. Read-only here.
      - endora-core-hq-token:/hq-token:ro
    networks:
      default: {}
      team:
        aliases: [node]
    mem_limit: ${ENDORA_NODE_MEMORY:-768m}
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,ssl,urllib.request as u,os;s='s' if os.environ.get('ENDORA_TLS')=='1' else '';c=ssl._create_unverified_context();assert json.load(u.urlopen(f'http{s}://127.0.0.1:8787/health',context=c,timeout=4))['status']=='ok'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # HQ (ADR 0102): the team engine, scheduling, routines, budgets and the owner's desk. In the
  # node's image; reachable only by the node and the workers, never published. Its database is
  # its own; the only secret it holds is the tokens it makes for the node and the runner.
  hq:
    <<: *fenced
    image: ${ENDORA_CORE_IMAGE:-ghcr.io/rusticpotatos/endora-node}:${ENDORA_CORE_VERSION:?set ENDORA_CORE_VERSION to a released Core version (core.env.example)}
    entrypoint: [endora-hq]
    read_only: true
    environment:
      HQ_ADDR: 0.0.0.0:8790
      HQ_DB: /data/hq.db
      HQ_TOKEN_FILE: /token/token
      HQ_RUNNER_TOKEN_FILE: /runner-token/token
      # 1: a scripted demo team on a simulated runner, to look around with no model or runner.
      HQ_DEMO: ${ENDORA_HQ_DEMO:-0}
      HQ_TICK_SECONDS: ${ENDORA_HQ_TICK_SECONDS:-30}
      ENDORA_TIME_ZONE: ${ENDORA_TIME_ZONE:-}
      ENDORA_UTC_OFFSET_MINUTES: ${ENDORA_UTC_OFFSET_MINUTES:-0}
      # Two malloc arenas, not glibc's eight per core: idle arenas, not data, filled the cap.
      MALLOC_ARENA_MAX: "2"
    volumes:
      - endora-core-hq-data:/data
      - endora-core-hq-token:/token
      - endora-core-hq-runner-token:/runner-token
    networks:
      default: {}
      team:
        aliases: [hq]
    mem_limit: ${ENDORA_HQ_MEMORY:-384m}
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,urllib.request as u;assert json.load(u.urlopen('http://127.0.0.1:8790/health',timeout=4))['ok']"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The runner (ADR 0102): takes each turn HQ hands it and starts it as a fresh worker
  # container. OFF unless you name its profile: `docker compose --profile workers up -d`.
  #
  # TRUST BOUNDARY. The runner mounts Docker's socket, which is as good as root on this host.
  # It trusts HQ with nothing but a run and its token: the image, mounts, network and limits of
  # every worker are its own, fixed in its code, not taken from HQ. Each worker runs:
  #   - on the `team` network below, internal: it reaches the node and HQ, nothing else (no
  #     internet, no LAN, not this host: the bridge has no host address, Docker 28+);
  #   - with a read-only root, every capability dropped and no-new-privileges;
  #   - within 256 MB, one CPU and 128 processes (a workbench turn: 1 GB, two CPUs and 256
  #     processes), /tmp 64 MB in memory, and no longer than 30 minutes, then killed;
  #   - opened only by its own turn's token, which ends with the turn.
  # Run it only on a host where Core may start containers. HQ hands it turns only with the demo
  # off (ENDORA_HQ_DEMO=0).
  runner:
    <<: *fenced
    profiles: [workers]
    image: ${ENDORA_CORE_IMAGE:-ghcr.io/rusticpotatos/endora-node}:${ENDORA_CORE_VERSION:?set ENDORA_CORE_VERSION to a released Core version (core.env.example)}
    entrypoint: [endora-runner]
    read_only: true
    environment:
      HQ_URL: http://hq:8790
      HQ_RUNNER_TOKEN_FILE: /runner-token/token
      # Workers run from this same image, on the fenced network by its fixed name.
      WORKER_IMAGE: ${ENDORA_CORE_IMAGE:-ghcr.io/rusticpotatos/endora-node}:${ENDORA_CORE_VERSION:?set ENDORA_CORE_VERSION}
      TEAM_NETWORK: endora-core-team
      # Turns at once (each within the limits above).
      RUNNER_CAPACITY: ${ENDORA_RUNNER_CAPACITY:-2}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The token HQ makes for the runner. Read-only here; only HQ writes it.
      - endora-core-hq-runner-token:/runner-token:ro
    # It only asks and tells; each worker has its own cap, set by the runner.
    mem_limit: 64m
    depends_on:
      hq:
        condition: service_healthy

networks:
  # The fence around the workers. Internal: no route out. Named outright, because the runner
  # starts workers on it by that name.
  team:
    name: endora-core-team
    internal: true
    driver_opts:
      # No address for the bridge on the host, so a worker cannot reach what the host serves
      # (Docker 28 and later; older engines ignore it, and then the host's bridge address is
      # reachable from the network: firewall it, or upgrade).
      com.docker.network.bridge.gateway_mode_ipv4: isolated

volumes:
  # The node's database, its secrets key and its TLS certificate. Back this up (docs/install.md).
  endora-core-data:
    name: ${ENDORA_CORE_DATA_VOLUME:-endora-core-data}
  # HQ's database: the team's work, its record and budgets. Back this up too.
  endora-core-hq-data:
    name: ${ENDORA_CORE_HQ_DATA_VOLUME:-endora-core-hq-data}
  # One file each: the tokens HQ makes for the node and for the runner. Remade if lost.
  endora-core-hq-token:
    name: ${ENDORA_CORE_HQ_TOKEN_VOLUME:-endora-core-hq-token}
  endora-core-hq-runner-token:
    name: ${ENDORA_CORE_HQ_RUNNER_TOKEN_VOLUME:-endora-core-hq-runner-token}
