---
# What the node is started with:
#   ANSIBLE_ROLES_PATH=roles ansible-playbook roles/endora/tests/render.yml
- name: Endora renders its settings
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    docker_home: /tmp/endora-render-test
    out: /tmp/endora-render-test/out
  # vars_files, not include_vars: included vars would outrank the per-task values below.
  vars_files:
    - ../defaults/main.yml
  tasks:
    - name: Output folder
      ansible.builtin.file:
        path: "{{ out }}"
        state: directory
        mode: "0700"

    - name: With mail, a data folder and the brain's folder
      ansible.builtin.template:
        src: ../templates/endora.env.j2
        dest: "{{ out }}/full.env"
        mode: "0600"
      vars:
        mail_mirror_enabled: true
        mail_mirror_root: /srv/mail-mirror
        endora_time_zone: America/New_York
        endora_data_dir: /data/endora
        endora_hq: true
        endora_vault_url: http://openbao:8200

    - name: Nothing switched on
      ansible.builtin.template:
        src: ../templates/endora.env.j2
        dest: "{{ out }}/bare.env"
        mode: "0600"
      vars:
        endora_time_zone: ""
        endora_brain_dir: ""

    - name: With the sound hub and its AirPlay 2 door
      ansible.builtin.template:
        src: ../templates/endora.env.j2
        dest: "{{ out }}/door.env"
        mode: "0600"
      vars:
        endora_sound: true
        endora_sound_airplay2: true
        endora_sound_airplay2_parent: eth0
        endora_sound_airplay2_subnet: 192.168.1.0/24
        endora_sound_airplay2_gateway: 192.0.2.1
        endora_sound_airplay2_ip: 192.168.1.10
        endora_sound_airplay2_latency: 0.25

    - name: Override with an address
      ansible.builtin.template:
        src: ../templates/docker-compose.override.yml.j2
        dest: "{{ out }}/san.yml"
        mode: "0600"
      vars:
        endora_tls_san: 192.168.1.10

    - name: Override without one
      ansible.builtin.template:
        src: ../templates/docker-compose.override.yml.j2
        dest: "{{ out }}/nosan.yml"
        mode: "0600"
      vars:
        endora_tls_san: ""

    - name: Read them back
      ansible.builtin.set_fact:
        full: "{{ lookup('file', out ~ '/full.env').splitlines() }}"
        bare: "{{ lookup('file', out ~ '/bare.env').splitlines() }}"
        door: "{{ lookup('file', out ~ '/door.env').splitlines() }}"
        san: "{{ lookup('file', out ~ '/san.yml') | from_yaml }}"
        nosan: "{{ lookup('file', out ~ '/nosan.yml') | from_yaml }}"

    - name: Check them
      ansible.builtin.assert:
        that:
          - "full | select('match', 'ENDORA_BUILD') | list | length == 0"
          - "'ENDORA_MAIL_DIR=/srv/mail-mirror/maildir' in full"
          - "'ENDORA_TIME_ZONE=America/New_York' in full"
          - "'ENDORA_DATA_DIR=/data/endora' in full"
          # The brain sits beside Endora's other folders unless told otherwise.
          - "'ENDORA_BRAIN_DIR=/tmp/endora-render-test/endora/brain' in full"
          - "bare | select('match', 'ENDORA_BRAIN_DIR') | list | length == 0"
          # HQ is off unless asked for.
          - "'ENDORA_HQ_URL=http://hq:8790' in full"
          - "'ENDORA_HQ_DEMO=1' in full"
          - "bare | select('match', 'ENDORA_HQ') | list | length == 0"
          - "'ENDORA_MODEL_URL=http://host.docker.internal:11434/v1' in full"
          # The vault (ADR 0127): its address when given, nothing when not; the passkey's name
          # is the node's default unless set.
          - "'ENDORA_VAULT_URL=http://openbao:8200' in full"
          - "bare | select('match', 'ENDORA_VAULT_URL') | list | length == 0"
          - "full | select('match', 'ENDORA_PASSKEY_RP_ID') | list | length == 0"
          # Off by default: no mail, and the data volume rather than a folder.
          - "bare | select('match', 'ENDORA_OWN_WORK') | list | length == 0"
          - "'ENDORA_TIME_ZONE=' in bare"
          - "bare | select('match', 'ENDORA_MAIL_DIR') | list | length == 0"
          - "bare | select('match', 'ENDORA_DATA_DIR') | list | length == 0"
          - "san.services.node.environment.ENDORA_TLS_SAN == '192.168.1.10'"
          - "nosan.services == {}"
          # The sound hub and the AirPlay 2 door (ADR 0128): off unless asked for; with the
          # door, its LAN values for the compose file's macvlan network, and the lead.
          - "bare | select('match', 'ENDORA_SOUND_URL|SOUND_AIRPLAY2') | list | length == 0"
          - "'ENDORA_SOUND_URL=http://sound:8791' in door"
          - "'SOUND_AIRPLAY2=1' in door"
          - "'SOUND_AIRPLAY2_PARENT=eth0' in door"
          - "'SOUND_AIRPLAY2_SUBNET=192.168.1.0/24' in door"
          - "'SOUND_AIRPLAY2_GATEWAY=192.0.2.1' in door"
          - "'SOUND_AIRPLAY2_IP=192.168.1.10' in door"
          - "'SOUND_AIRPLAY2_HOSTNAME=endora-mixer' in door"
          - "'SOUND_AIRPLAY2_LATENCY=0.25' in door"
          - "door | select('match', 'SOUND_AIRPLAY2_MAC') | list | length == 0"

    - name: No profiles and everything missing, with nothing set
      ansible.builtin.assert:
        that:
          - "endora_profiles == []"
          - "endora_sound_airplay2_missing == ['endora_sound_airplay2_parent', 'endora_sound_airplay2_subnet', 'endora_sound_airplay2_gateway', 'endora_sound_airplay2_ip', 'endora_sound']"

    - name: The hub, its senders and the door, with the door's values
      ansible.builtin.assert:
        that:
          - "endora_profiles == ['sound', 'senders', 'airplay2']"
          - "endora_sound_airplay2_missing == []"
      vars: &door
        endora_sound: true
        endora_sound_senders: true
        endora_sound_airplay2: true
        endora_sound_airplay2_parent: eth0
        endora_sound_airplay2_subnet: 192.168.1.0/24
        endora_sound_airplay2_gateway: 192.0.2.1
        endora_sound_airplay2_ip: 192.168.1.10

    - name: The door without the hub is refused
      ansible.builtin.assert:
        that:
          - "endora_sound_airplay2_missing == ['endora_sound']"
      vars:
        <<: *door
        endora_sound: false

    # The rule this role exists to keep: Endora is never built or pulled on the NAS.
    - name: Every Compose call in the role neither builds nor pulls
      ansible.builtin.assert:
        that:
          - compose | length == 2
          - started | length == 1
          - started | map(attribute='build') | list == ['never']
          - started | map(attribute='pull') | list == ['never']
      vars:
        tasks: "{{ lookup('file', '../tasks/main.yml') | from_yaml }}"
        # By key: a dotted module name would be read as nested attributes.
        compose: >-
          {{ tasks | map(attribute='block') | flatten | map('dict2items') | flatten
             | selectattr('key', 'equalto', 'community.docker.docker_compose_v2')
             | map(attribute='value') | list }}
        started: "{{ compose | selectattr('state', 'equalto', 'present') | list }}"

    - name: Clean up
      ansible.builtin.file:
        path: /tmp/endora-render-test
        state: absent
