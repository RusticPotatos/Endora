---
- name: Check the egress policy
  ansible.builtin.assert:
    that:
      - docker_egress_policy.name is match('^[a-z0-9]{1,12}$')
      - docker_egress_policy.bridge is match('^[a-z0-9-]{1,15}$')
      # Inside Docker's own 172.16.0.0/12, written out so no extra collection is needed.
      - docker_egress_policy.subnet is match('^172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}/(1[6-9]|2[0-9]|30)$')
      - (docker_egress_policy.allow_public_tcp_ports | default([])) | map('int') | select('gt', 0) | list | length
        == (docker_egress_policy.allow_public_tcp_ports | default([])) | length
    fail_msg: "a docker_egress_policy needs a short name, a bridge name and a subnet inside 172.16.0.0/12"
  when: docker_egress_policy_state == 'present'

- name: Egress runner and its service
  when: docker_egress_policy_state == 'present'
  block:
    - name: Policy directory
      ansible.builtin.file:
        path: "{{ docker_egress_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Runner
      ansible.builtin.copy:
        src: docker-egress
        dest: "{{ docker_egress_runner }}"
        owner: root
        group: root
        mode: "0750"

    - name: Service that re-applies the policies whenever Docker starts
      ansible.builtin.template:
        src: docker-egress.service.j2
        dest: /etc/systemd/system/docker-egress.service
        owner: root
        group: root
        mode: "0644"
      register: docker_egress_unit

- name: "Policy {{ docker_egress_policy.name }}"
  ansible.builtin.template:
    src: policy.sh.j2
    dest: "{{ docker_egress_directory }}/{{ docker_egress_policy.name }}.sh"
    owner: root
    group: root
    mode: "0750"
  register: docker_egress_policy_file
  when: docker_egress_policy_state == 'present'

- name: "Remove policy {{ docker_egress_policy.name }}"
  when: docker_egress_policy_state == 'absent'
  block:
    - name: Take its rules out
      ansible.builtin.command: "sh {{ docker_egress_directory }}/{{ docker_egress_policy.name }}.sh remove"
      args:
        removes: "{{ docker_egress_directory }}/{{ docker_egress_policy.name }}.sh"
      changed_when: true

    - name: Delete its file
      ansible.builtin.file:
        path: "{{ docker_egress_directory }}/{{ docker_egress_policy.name }}.sh"
        state: absent

- name: Enable the service and apply the policies now
  ansible.builtin.systemd:
    name: docker-egress
    enabled: true
    daemon_reload: "{{ docker_egress_unit is changed }}"
    state: restarted
  when:
    - docker_egress_policy_state == 'present'
    - docker_egress_unit is changed or docker_egress_policy_file is changed
