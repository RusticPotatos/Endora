- name: Validate the agent's user
  ansible.builtin.assert:
    that:
      - endora_terminal_agent_user != 'root'

- name: Prepare managed executable directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

# The agent and its setup wizard ship with this collection, versioned with Endora.
- name: Install the job agent
  ansible.builtin.copy:
    src: terminal-jobs.py
    dest: /usr/local/libexec/endora-terminal-jobs.py
    owner: root
    group: root
    mode: '0755'
  become: true
  notify: Restart Endora job agent

- name: Install the job agent's setup wizard
  ansible.builtin.copy:
    src: terminal-jobs-setup.py
    dest: /usr/local/libexec/endora-terminal-jobs-setup.py
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Install job agent supervisor
  ansible.builtin.template:
    src: endora-terminal-jobs.service.j2
    dest: /etc/systemd/system/endora-terminal-jobs.service
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Restart Endora job agent

- name: Enable private job agent
  ansible.builtin.systemd_service:
    name: endora-terminal-jobs
    daemon_reload: true
    enabled: true
    state: started
  become: true
