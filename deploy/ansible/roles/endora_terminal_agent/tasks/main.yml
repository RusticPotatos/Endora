- name: Validate explicit private agent setup
  ansible.builtin.assert:
    that:
      - endora_terminal_agent_source | length > 0
      - endora_terminal_agent_user != 'root'

- name: Prepare managed executable directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Install job agent source
  ansible.builtin.copy:
    src: "{{ endora_terminal_agent_source }}"
    dest: /usr/local/libexec/endora-terminal-jobs.py
    owner: root
    group: root
    mode: '0755'
    remote_src: true
  become: true
  notify: Restart Endora job agent

- name: Install job agent supervisor
  ansible.builtin.template:
    src: endora-terminal-jobs.service.j2
    dest: /etc/systemd/system/endora-terminal-jobs.service
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Restart Endora job agent

- name: Enable private job agent
  ansible.builtin.systemd_service:
    name: endora-terminal-jobs
    daemon_reload: true
    enabled: true
    state: started
  become: true
